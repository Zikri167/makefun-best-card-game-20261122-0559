<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Pact — Elemental Card Duel</title>
<style>
  html, body { margin: 0; padding: 0; background: #17100b; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #wrap { width: min(1280px, 100vw); }
  canvas { display: block; width: 100%; height: auto; background: #1e5c38; }
  #status { color: #c9a35c; font: 13px sans-serif; text-align: center; padding: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="status">Ember Pact — click a card to play · Q POWER · W WARD · Space end turn · R restart · M mute · P pause</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
